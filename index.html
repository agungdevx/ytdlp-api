<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>YTDLP</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px}
input,select,button{width:100%;padding:10px;margin:6px 0;font-size:16px;box-sizing:border-box}
pre{background:#111;color:#0f0;padding:10px;overflow:auto;border-radius:6px}</style>
</head><body>
<h3>YT-DLP Downloader</h3>
<input id="url" placeholder="Paste link YouTube/TikTok/FB/IG">
<select id="fmt"><option value="video">Video MP4</option><option value="audio">Audio MP3</option></select>
<button onclick="go()">Download</button>
<pre id="log">Konsol...</pre>

<script>
async function go(){
  const log = document.getElementById('log');
  log.textContent = 'Memproses...';
  try {
    const r = await fetch('/api/download', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url: url.value, format: fmt.value})
    });
    const d = await r.json();
    log.textContent = JSON.stringify(d, null, 2);
    if(d.url) window.open(d.url, '_blank');
  } catch(e){ log.textContent = 'Error: '+e.message; }
}
</script>
</body></html>
